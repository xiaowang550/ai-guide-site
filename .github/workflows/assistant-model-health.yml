name: 免费模型每日实测
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assistant-model-health.yml'
      - 'lib/assistant-maintenance-auth.ts'
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: assistant-model-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 核验目录并逐个测试免费模型
        run: node scripts/assistant-model-health.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-model-health
          path: assistant-model-health.json
          if-no-files-found: ignore
          retention-days: 30
