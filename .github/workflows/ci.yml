# 常规质量门禁
#
# 每次 push 和 PR 都跑：类型 → lint → 单测 → 构建 + 产物校验。
# 这些都是「不会随时间自己变好」的事，所以每次提交都必须重新确认，
# 不能因为上次通过了就假定这次也通过。
name: 质量门禁

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一个分支的新提交取消旧构建，省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型 / lint / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 代码规范
        run: npm run lint

      - name: 单元测试
        run: npx vitest run --reporter=dot

      # build.mjs 内部会跑 tsc + lint + 产物校验，这里只关心产物是否正确
      - name: 构建（静态导出 + 产物校验）
        run: npm run build

      - name: 数据一致性审计
        run: |
          node scripts/audit-consistency.mjs
          node scripts/audit-hardcoded.mjs --strict
          node scripts/audit-client-data.mjs --strict

      # 体积门禁：比基线涨超 5% 就失败。
      # 内容增加（多几个工具/概念）本来就会让 HTML 变大，所以调基线前
      # 请先跑 audit-client-data --strict 确认不是数据被打进了客户端包。
      - name: 首屏体积不超过基线 5%
        run: node scripts/perf-baseline.mjs --check

      - name: 内容覆盖文件必须是空占位
        run: |
          # data/generated/content-override.json 被 git 跟踪，因为 data/index.ts
          # 静态 import 它 —— 全新 checkout 下文件不存在的话，类型检查这一步
          # 就会报「找不到模块」（CI 从这里挂过一次）。
          #
          # 所以仓库里这一份必须永远是空占位：真正的覆盖由构建时
          # scripts/sync-content.mjs 从线上拉取后写入，不需要进 git。
          #
          # 检查的是 **提交进仓库的那一份**（HEAD），不是构建后的工作区文件 ——
          # 构建本来就会把它改写。
          committed=$(git show HEAD:data/generated/content-override.json)
          if ! echo "$committed" | grep -q '"overrides": {}'; then
            echo "::error::content-override.json 在仓库里不是空占位。生产内容不应进 git —— 构建时会自动从 /api/content/published 拉取。请 git checkout 恢复这个文件。"
            exit 1
          fi

      - name: 检查未提交产物
        run: |
          # 构建会写出 .next/ 与 out/，这些应该在 .gitignore 里，
          # 如果没被忽略说明 .gitignore 漏了，会让仓库越来越大
          git status --porcelain | grep -E '^\?\? (out|\.next)/' && {
            echo "::error::out/ 或 .next/ 未被 .gitignore 忽略"
            exit 1
          } || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 7